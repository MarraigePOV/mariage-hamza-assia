<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Hamza & Assia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@300;400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
<style>
:root{
  --base:#F5F0E8;--dark:#1A1208;--dark2:#241808;
  --or:#B8965A;--or-l:#E8D5A3;--or-d:#9A7A45;
  --text:#F5EED8;--muted:rgba(245,238,216,.5);
  --lin:rgba(184,150,90,.18);
  --err:#C06050;--ok:#5A8A6A;
  --f-serif:'Cormorant Garamond',serif;
  --f-cap:'Cinzel',serif;--f-sans:'Lato',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--dark);color:var(--text);font-family:var(--f-sans);font-weight:300;min-height:100vh;overflow-x:hidden}

/* ── LOGIN ── */
#login{position:fixed;inset:0;z-index:100;background:var(--dark);display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:rgba(255,249,242,.04);border:1px solid rgba(184,150,90,.2);padding:52px 40px;max-width:360px;width:100%;text-align:center}
.login-title{font-family:var(--f-serif);font-weight:300;font-style:italic;font-size:1.8rem;color:var(--or-l);margin-bottom:6px}
.login-sub{font-family:var(--f-cap);font-size:7.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
.login-input{width:100%;background:rgba(255,249,242,.05);border:1px solid rgba(184,150,90,.2);padding:13px 16px;color:var(--text);font-family:var(--f-sans);font-size:13px;letter-spacing:.06em;outline:none;transition:border-color .3s;margin-bottom:10px}
.login-input:focus{border-color:var(--or)}
.login-btn{width:100%;background:var(--or-d);color:var(--base);border:none;padding:14px;font-family:var(--f-cap);font-weight:300;font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.login-btn:hover{background:var(--or)}
.login-err{font-size:10px;color:var(--err);margin-top:10px;display:none;font-family:var(--f-cap);letter-spacing:.1em}

/* ── APP ── */
#app{display:none;min-height:100vh}

/* ── HEADER ── */
.admin-header{border-bottom:1px solid var(--lin);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(26,18,8,.97);backdrop-filter:blur(10px);z-index:50;flex-wrap:wrap;gap:10px}
.header-brand{font-family:var(--f-serif);font-style:italic;font-size:1.15rem;color:var(--or-l)}
.header-brand-sub{font-family:var(--f-cap);font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:block;margin-top:2px;font-style:normal}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tab-btn{background:transparent;border:1px solid rgba(184,150,90,.18);color:var(--muted);padding:7px 15px;font-family:var(--f-cap);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.tab-btn.active,.tab-btn:hover{border-color:var(--or);color:var(--or)}
.btn-logout{background:transparent;border:none;color:var(--muted);font-size:8px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;font-family:var(--f-cap);padding:7px 10px;transition:color .2s}
.btn-logout:hover{color:var(--text)}

/* ── STATS ── */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-bottom:1px solid var(--lin)}
.stat-item{padding:18px 24px;text-align:center;border-right:1px solid var(--lin)}
.stat-item:last-child{border-right:none}
.stat-num{font-family:var(--f-serif);font-style:italic;font-size:1.9rem;color:var(--or);line-height:1}
.stat-label{font-family:var(--f-cap);font-size:7px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* ── TOOLBAR ── */
.toolbar{padding:14px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--lin);background:rgba(26,18,8,.6)}
.search-input{background:rgba(255,249,242,.04);border:1px solid rgba(184,150,90,.18);color:var(--text);padding:7px 13px;font-family:var(--f-sans);font-size:11px;outline:none;width:190px;transition:border-color .3s}
.search-input:focus{border-color:var(--or)}
.search-input::placeholder{color:var(--muted)}
.filter-select{background:rgba(255,249,242,.04);border:1px solid rgba(184,150,90,.18);color:var(--text);padding:7px 13px;font-family:var(--f-sans);font-size:11px;outline:none;cursor:pointer}
.filter-select option{background:var(--dark2)}
.spacer{flex:1}
.action-btn{background:transparent;border:1px solid rgba(184,150,90,.3);color:var(--or);padding:7px 16px;font-family:var(--f-cap);font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .2s;white-space:nowrap}
.action-btn:hover{background:rgba(184,150,90,.1);border-color:var(--or)}
.action-btn:disabled{opacity:.3;cursor:not-allowed}
.refresh-btn{background:transparent;border:1px solid rgba(184,150,90,.18);color:var(--muted);width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.refresh-btn:hover{border-color:var(--or);color:var(--or)}

/* ── GALERIE ── */
.gallery-wrap{padding:24px 32px 60px}
.gallery-grid{columns:4 180px;column-gap:10px}
.gallery-item{break-inside:avoid;margin-bottom:10px;position:relative;overflow:hidden;background:rgba(255,249,242,.03);animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.gallery-item img{width:100%;display:block;filter:brightness(.92);transition:filter .3s;aspect-ratio:1;object-fit:cover}
.gallery-item:hover img{filter:brightness(1)}
.gi-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,18,8,.8) 0%,transparent 55%);opacity:0;transition:opacity .3s;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.gallery-item:hover .gi-overlay{opacity:1}
.gi-name{font-family:var(--f-serif);font-style:italic;font-size:.88rem;color:var(--or-l);line-height:1.2}
.gi-event{font-family:var(--f-cap);font-size:6.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.gi-desc{font-size:8.5px;color:rgba(245,238,216,.65);margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi-time{font-size:7.5px;color:var(--muted);margin-top:2px}
.gi-actions{position:absolute;top:7px;right:7px;display:flex;gap:5px;opacity:0;transition:opacity .3s}
.gallery-item:hover .gi-actions{opacity:1}
.gi-btn{background:rgba(26,18,8,.8);border:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);transition:background .2s}
.gi-btn:hover{background:var(--or-d)}
.gi-btn.del:hover{background:var(--err)}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:80px 40px}
.empty-icon{opacity:.2;margin-bottom:20px}
.empty-state h3{font-family:var(--f-serif);font-style:italic;font-size:1.4rem;color:var(--text);opacity:.5;margin-bottom:8px}
.empty-state p{font-size:11px;color:var(--muted)}

/* ── PAGINATION ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 32px;flex-wrap:wrap;border-top:1px solid var(--lin)}
.page-btn{background:transparent;border:1px solid rgba(184,150,90,.18);color:var(--muted);width:32px;height:32px;font-family:var(--f-cap);font-size:9px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.page-btn:hover,.page-btn.active{border-color:var(--or);color:var(--or)}
.page-dots{color:var(--muted);font-size:10px;padding:0 4px}
.page-info{font-family:var(--f-cap);font-size:7.5px;letter-spacing:.18em;color:var(--muted)}

/* ── LIGHTBOX ── */
#lightbox{display:none;position:fixed;inset:0;background:rgba(8,5,2,.96);z-index:400;align-items:center;justify-content:center;padding:20px}
#lightbox.open{display:flex;flex-direction:column;gap:16px}
#lightbox img{max-width:90vw;max-height:80vh;object-fit:contain}
#lb-close{position:absolute;top:18px;right:22px;background:transparent;border:none;color:var(--or-l);font-size:22px;cursor:pointer;font-family:var(--f-serif);line-height:1}
.lb-info{text-align:center}
.lb-name{font-family:var(--f-serif);font-style:italic;font-size:1.1rem;color:var(--or-l)}
.lb-meta{font-family:var(--f-cap);font-size:7.5px;letter-spacing:.15em;color:rgba(245,238,216,.4);margin-top:5px}
.lb-desc{font-family:var(--f-serif);font-style:italic;font-size:.88rem;color:var(--muted);margin-top:4px}
.lb-actions{display:flex;gap:10px;justify-content:center;margin-top:10px}
.lb-btn{background:transparent;border:1px solid rgba(184,150,90,.3);color:var(--or);padding:8px 18px;font-family:var(--f-cap);font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s}
.lb-btn:hover{background:rgba(184,150,90,.1);border-color:var(--or)}
.lb-btn.del{color:var(--err);border-color:rgba(192,96,80,.3)}
.lb-btn.del:hover{background:rgba(192,96,80,.1);border-color:var(--err)}

/* ── DL PROGRESS ── */
.dl-prog{display:none;position:fixed;bottom:20px;right:20px;background:var(--dark2);border:1px solid var(--lin);padding:16px 20px;z-index:200;min-width:240px;animation:fi .3s ease both}
.dl-prog.show{display:block}
.dl-prog-label{font-family:var(--f-cap);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--or);margin-bottom:8px}
.dl-prog-bar{height:1px;background:rgba(184,150,90,.15);position:relative}
.dl-prog-fill{position:absolute;top:0;left:0;height:100%;background:var(--or);transition:width .3s}
.dl-prog-count{font-size:9px;color:var(--muted);margin-top:6px}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dark2);color:var(--or-l);font-family:var(--f-cap);font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;padding:12px 22px;z-index:500;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s;opacity:0;border:1px solid var(--lin);white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.toast.err{background:var(--err);border-color:var(--err);color:#fff}

@media(max-width:768px){
  .admin-header,.toolbar,.gallery-wrap{padding-left:16px;padding-right:16px}
  .gallery-grid{columns:2}
  .stats-bar{grid-template-columns:1fr 1fr}
  .stat-item{padding:14px 12px}
  .search-input{width:140px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="login-title">Espace Admin</div>
    <div class="login-sub">Hamza &amp; Assia · 2026</div>
    <input type="password" id="pwd" class="login-input" placeholder="Mot de passe"/>
    <button class="login-btn" id="login-btn">Accéder</button>
    <div class="login-err" id="login-err">Mot de passe incorrect.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="admin-header">
    <div class="header-brand">
      Album Admin
      <span class="header-brand-sub">Hamza &amp; Assia · 2026</span>
    </div>
    <div class="header-right">
      <button class="tab-btn active" id="tab-all"     onclick="setTab('all')">Toutes</button>
      <button class="tab-btn"        id="tab-henna"   onclick="setTab('henna')">Henné</button>
      <button class="tab-btn"        id="tab-mariage" onclick="setTab('mariage')">Mariage</button>
      <button class="btn-logout" onclick="logout()">Déco</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" id="s-total">—</div><div class="stat-label">Total photos</div></div>
    <div class="stat-item"><div class="stat-num" id="s-users">—</div><div class="stat-label">Invités</div></div>
    <div class="stat-item"><div class="stat-num" id="s-henna">—</div><div class="stat-label">Henné</div></div>
    <div class="stat-item"><div class="stat-num" id="s-mariage">—</div><div class="stat-label">Mariage</div></div>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="search" placeholder="Rechercher un invité…" oninput="applyFilters()"/>
    <select class="filter-select" id="sort-sel" onchange="applyFilters()">
      <option value="desc">Plus récent</option>
      <option value="asc">Plus ancien</option>
    </select>
    <button class="refresh-btn" onclick="loadPhotos()" title="Rafraîchir">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.84"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="action-btn" onclick="downloadPage()">↓ Page (15)</button>
    <button class="action-btn" onclick="downloadAll()">↓ Tout télécharger</button>
  </div>

  <div class="gallery-wrap">
    <div class="gallery-grid" id="gallery-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#B8965A" stroke-width="1">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      <h3>Aucune photo</h3>
      <p>Les photos apparaîtront ici dès que les invités les partageront.</p>
    </div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt=""/>
  <div class="lb-info">
    <div class="lb-name" id="lb-name"></div>
    <div class="lb-meta" id="lb-meta"></div>
    <div class="lb-desc" id="lb-desc"></div>
    <div class="lb-actions">
      <a class="lb-btn" id="lb-dl-btn" href="#" target="_blank" download>↓ Télécharger</a>
      <button class="lb-btn del" id="lb-del-btn">Supprimer</button>
    </div>
  </div>
</div>

<!-- DL PROGRESS -->
<div class="dl-prog" id="dl-prog">
  <div class="dl-prog-label" id="dl-prog-label">Téléchargement…</div>
  <div class="dl-prog-bar"><div class="dl-prog-fill" id="dl-prog-fill"></div></div>
  <div class="dl-prog-count" id="dl-prog-count"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, getDocs, deleteDoc, doc, where }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
/* Storage = Cloudinary */
const CLOUDINARY_CLOUD  = 'ddvulkoma';
const CLOUDINARY_PRESET = 'saqpy6qg';

const firebaseConfig = {
  apiKey: "AIzaSyA0bWnVGhLJzahyAwCDu2nYPc2PCDEAV0w",
  authDomain: "mariage-hamza-assia.firebaseapp.com",
  projectId: "mariage-hamza-assia",
  storageBucket: "mariage-hamza-assia.firebasestorage.app",
  messagingSenderId: "212021574745",
  appId: "1:212021574745:web:a9f070733d889a94728548"
};
const app     = initializeApp(firebaseConfig);
const db      = getFirestore(app);


/* ══ CONFIG ══ */
const ADMIN_PWD = 'hamzaassia2026'; // ← CHANGE ICI
const PAGE_SIZE = 15;

/* ══ STATE ══ */
let allPhotos      = [];
let filteredPhotos = [];
let currentTab     = 'all';
let currentPage    = 1;
let currentLbId    = null;
let toastTimer     = null;

/* ══ LOGIN ══ */
const loginBtn = document.getElementById('login-btn');
const pwdInput = document.getElementById('pwd');
loginBtn.addEventListener('click', checkLogin);
pwdInput.addEventListener('keydown', e => { if(e.key==='Enter') checkLogin(); });

function checkLogin() {
  if (pwdInput.value === ADMIN_PWD) {
    document.getElementById('login').style.display  = 'none';
    document.getElementById('app').style.display    = 'block';
    loadPhotos();
  } else {
    document.getElementById('login-err').style.display = 'block';
    pwdInput.value = ''; pwdInput.focus();
  }
}
window.logout = () => {
  document.getElementById('app').style.display   = 'none';
  document.getElementById('login').style.display = 'flex';
  pwdInput.value = '';
};

/* ══ TABS ══ */
window.setTab = function(tab) {
  currentTab = tab; currentPage = 1;
  ['all','henna','mariage'].forEach(t =>
    document.getElementById('tab-'+t).classList.toggle('active', t===tab)
  );
  applyFilters();
};

/* ══ LOAD ══ */
window.loadPhotos = async function() {
  try {
    const q    = query(collection(db,'photos'), orderBy('createdAt','desc'));
    const snap = await getDocs(q);
    allPhotos  = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    updateStats();
    applyFilters();
    showToast('Photos chargées','ok');
  } catch(e) {
    console.error(e); showToast('Erreur de chargement','err');
  }
};

/* ══ STATS ══ */
function updateStats() {
  document.getElementById('s-total').textContent   = allPhotos.length;
  document.getElementById('s-users').textContent   = new Set(allPhotos.map(p=>p.userId)).size;
  document.getElementById('s-henna').textContent   = allPhotos.filter(p=>p.event==='henna').length;
  document.getElementById('s-mariage').textContent = allPhotos.filter(p=>p.event==='mariage').length;
}

/* ══ FILTRES ══ */
window.applyFilters = function() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const sort   = document.getElementById('sort-sel').value;
  let photos   = [...allPhotos];
  if (currentTab !== 'all') photos = photos.filter(p=>p.event===currentTab);
  if (search) photos = photos.filter(p=>(p.userName||'').toLowerCase().includes(search));
  if (sort === 'asc') photos.reverse();
  filteredPhotos = photos;
  currentPage    = 1;
  renderGallery();
  renderPagination();
};

/* ══ GALERIE ══ */
function renderGallery() {
  const grid  = document.getElementById('gallery-grid');
  const empty = document.getElementById('empty-state');
  const start = (currentPage-1)*PAGE_SIZE;
  const page  = filteredPhotos.slice(start, start+PAGE_SIZE);

  if (!filteredPhotos.length) { grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = page.map((p,i) => {
    const ts = p.createdAt?.seconds ? new Date(p.createdAt.seconds*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';
    const ev = p.event==='henna' ? 'Henné' : 'Mariage';
    return `
    <div class="gallery-item" style="animation-delay:${i*.04}s">
      <img src="${p.url}" alt="${p.userName||''}" loading="lazy" onclick="openLightbox('${p.id}')" style="cursor:pointer"/>
      <div class="gi-overlay">
        <div class="gi-actions">
          <a class="gi-btn" href="${p.url}" target="_blank" download title="Télécharger" onclick="event.stopPropagation()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </a>
          <button class="gi-btn del" title="Supprimer" onclick="event.stopPropagation();deletePhoto('${p.id}','${p.storagePath||''}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
        <div class="gi-name">${p.userName||'Anonyme'}</div>
        <div class="gi-event">${ev}${ts?' · '+ts:''}</div>
        ${p.description?`<div class="gi-desc">${p.description}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

/* ══ PAGINATION ══ */
function renderPagination() {
  const total = Math.ceil(filteredPhotos.length/PAGE_SIZE);
  const pag   = document.getElementById('pagination');
  if (total<=1){pag.innerHTML='';return;}
  let html='';
  if(currentPage>1) html+=`<button class="page-btn" onclick="goPage(${currentPage-1})">←</button>`;
  for(let i=1;i<=total;i++){
    if(i===1||i===total||Math.abs(i-currentPage)<=1)
      html+=`<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
    else if(Math.abs(i-currentPage)===2)
      html+=`<span class="page-dots">…</span>`;
  }
  if(currentPage<total) html+=`<button class="page-btn" onclick="goPage(${currentPage+1})">→</button>`;
  html+=`<span class="page-info" style="margin-left:8px">Page ${currentPage} / ${total} · ${filteredPhotos.length} photos</span>`;
  pag.innerHTML=html;
}
window.goPage = function(n){
  currentPage=n; renderGallery(); renderPagination();
  window.scrollTo({top:0,behavior:'smooth'});
};

/* ══ DELETE ══ */
window.deletePhoto = async function(id,storagePath) {
  if(!confirm('Supprimer cette photo définitivement ?')) return;
  try {
    await deleteDoc(doc(db,'photos',id));
    // Note: suppression Cloudinary nécessite un backend signé
    // Le fichier restera sur Cloudinary mais disparaît de l'album
    allPhotos=allPhotos.filter(p=>p.id!==id);
    if(currentLbId===id) closeLightbox();
    updateStats(); applyFilters();
    showToast('Photo supprimée','ok');
  } catch(e){ showToast('Erreur suppression','err'); }
};

/* ══ LIGHTBOX ══ */
window.openLightbox = function(id) {
  const p=filteredPhotos.find(x=>x.id===id);
  if(!p) return;
  currentLbId=id;
  const ts  = p.createdAt?.seconds ? new Date(p.createdAt.seconds*1000).toLocaleString('fr-FR') : '';
  const ev  = p.event==='henna' ? 'Soirée Henné · 1er Juillet' : 'Mariage · 4 Juillet';
  document.getElementById('lb-img').src       = p.url;
  document.getElementById('lb-name').textContent = p.userName||'Anonyme';
  document.getElementById('lb-meta').textContent = ev+(ts?' · '+ts:'');
  document.getElementById('lb-desc').textContent = p.description||'';
  // Téléchargement direct via href (pas de CORS issue)
  const dlBtn=document.getElementById('lb-dl-btn');
  dlBtn.href=(p.url);
  dlBtn.setAttribute('download', (p.userName||'photo').replace(/\s+/g,'-')+'.jpg');
  document.getElementById('lb-del-btn').onclick=()=>window.deletePhoto(p.id,p.storagePath||'');
  document.getElementById('lightbox').classList.add('open');
};
window.closeLightbox=()=>{document.getElementById('lightbox').classList.remove('open');currentLbId=null;};
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===document.getElementById('lightbox'))window.closeLightbox();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')window.closeLightbox();});

/* ══ TÉLÉCHARGEMENT ══
   On utilise des liens directs (target=_blank) au lieu de fetch
   pour éviter les problèmes CORS avec Firebase Storage
*/
window.downloadPage = function() {
  const start = (currentPage-1)*PAGE_SIZE;
  const page  = filteredPhotos.slice(start,start+PAGE_SIZE);
  downloadBatch(page);
};

window.downloadAll = function() {
  downloadBatch(filteredPhotos);
};

async function downloadBatch(photos) {
  if(!photos.length){showToast('Aucune photo','err');return;}
  const prog  = document.getElementById('dl-prog');
  const fill  = document.getElementById('dl-prog-fill');
  const label = document.getElementById('dl-prog-label');
  const count = document.getElementById('dl-prog-count');
  prog.classList.add('show');

  let done=0;
  for(const p of photos){
    const ev   = p.event==='henna'?'henna-01-juillet':'mariage-04-juillet';
    const user = (p.userName||'anonyme').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
    const name = `${ev}_${user}_${String(done+1).padStart(3,'0')}.jpg`;
    label.textContent = p.userName||'?';
    count.textContent = `${done+1} / ${photos.length}`;
    fill.style.width  = Math.round(((done+1)/photos.length)*100)+'%';
    // Ouvrir chaque photo dans un nouvel onglet avec download
    // (méthode la plus compatible CORS avec Firebase Storage)
    try{
      const a=document.createElement('a');
      a.href=p.url; a.download=name; a.target='_blank';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }catch(e){console.error(e);}
    done++;
    await new Promise(r=>setTimeout(r,600)); // délai pour ne pas spammer
  }
  prog.classList.remove('show');
  showToast(`${done} photos · téléchargement lancé`,'ok');
}

/* ══ TOAST ══ */
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(type?' '+type:'');
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}
</script>
